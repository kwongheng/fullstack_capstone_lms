version: '3.8'

services:
  vault:
    image: hashicorp/vault:latest
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_ROOT_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK

  vault-init:
    image: hashicorp/vault:latest
    depends_on:
      - vault
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_ROOT_TOKEN}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "Waiting for Vault..."
        sleep 5

        vault secrets enable -path=database database || true

        vault write database/config/lms \
            plugin_name=mysql-database-plugin \
            connection_url="root:${MYSQL_ROOT_PASSWORD}@tcp(host.docker.internal:3306)/" \
            allowed_roles="my-app-role" \
            username="root" \
            password="${MYSQL_ROOT_PASSWORD}" || true

        vault write database/roles/my-app-role \
            db_name=lms \
            creation_statements="CREATE USER '{{name}}'@'%' IDENTIFIED BY '{{password}}'; GRANT ALL PRIVILEGES ON lms.* TO '{{name}}'@'%';" \
            revocation_statements="DROP USER IF EXISTS '{{name}}'@'%';" \
            default_ttl="4h" \
            max_ttl="24h" || true

        echo "Vault database setup complete!"