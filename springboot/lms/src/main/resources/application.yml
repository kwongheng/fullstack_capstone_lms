spring:
  config:
    import: vault://  # Enables Vault integration (modern way)

  cloud:
    vault:
      host: localhost
      port: 8200
      scheme: http
      authentication: TOKEN
      token: myroot  # Dev-only token
      database:      # Generic JDBC support (works for MySQL)
        enabled: true
        role: my-app-role  # Must match your Vault role name
        backend: database  # Your database secrets engine path

  datasource:
    url: jdbc:mysql://localhost:3306/lms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate        # or 'update' during development
    show-sql: true
    properties:
      hibernate:
        '[format_sql]': true